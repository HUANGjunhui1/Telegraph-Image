<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="免费图床，基于 Cloudflare Pages 的图片上传工具">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<title>Telegraph-Image | 免费图床</title>
<style>
/* Starry theme: a deep-space backdrop (layered nebula gradients + a canvas
   starfield drawn by the script below) under dark glass cards. Accent is a
   starlight blue-to-violet gradient; status colors are lifted for contrast
   on dark surfaces. Layout, spacing rhythm and every class hook are carried
   over from the previous design so the markup and script stay untouched. */
:root {
  --accent: #4da3ff;
  --accent-2: #7c6cff;
  --accent-soft: rgba(96, 150, 255, .16);
  --ink: #e9eef8;
  --body: #a7b1c6;
  --muted: #6f7b93;
  --line: rgba(255, 255, 255, .08);
  --ok: #2fe6b0;
  --err: #ff6b72;
  --glass: rgba(12, 17, 36, .68);
  --glass-border: rgba(255, 255, 255, .09);
  --card-shadow: 0 24px 60px rgba(1, 4, 16, .55), 0 2px 10px rgba(1, 4, 16, .35),
    inset 0 1px 0 rgba(255, 255, 255, .06);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  color: var(--body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* Deep-space gradient paints immediately and stays if anything above it
     fails, so the page is never a flat screen. */
  background: linear-gradient(165deg, #04060f 0%, #081026 45%, #0d1030 75%, #120b2e 100%);
}
::selection { background: rgba(96, 150, 255, .38); color: #fff; }

/* ---- starfield backdrop ---- */
#backdrop {
  position: fixed; inset: 0; z-index: -2; overflow: hidden;
  background:
    radial-gradient(1100px 520px at 82% -10%, rgba(96, 78, 190, .28), transparent 60%),
    radial-gradient(900px 480px at 8% 108%, rgba(28, 92, 160, .22), transparent 60%),
    radial-gradient(620px 300px at 55% 42%, rgba(64, 110, 200, .10), transparent 65%),
    linear-gradient(165deg, #04060f 0%, #081026 45%, #0d1030 75%, #120b2e 100%);
  background-size: cover; background-position: center;
}
#starfield { position: absolute; inset: 0; display: block; }
#tint {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  /* Soft vignette keeps the edges deep and the center luminous. */
  background: radial-gradient(120% 90% at 50% 38%, transparent 55%, rgba(2, 4, 12, .52) 100%);
}

/* ---- page frame ---- */
.page { min-height: 100vh; display: flex; flex-direction: column; padding: 30px; }
.topbar { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
.topbar a {
  display: inline-flex; align-items: center; gap: 6px;
  color: #dbe6ff; text-decoration: none; font-size: 12px; font-weight: 500;
  padding: 6px 11px; border-radius: 40px;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 255, 255, .13);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: background .18s, border-color .18s, transform .18s;
}
.topbar a:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .28); }
.topbar a:active { transform: translateY(1px); }
.icon { width: 14px; height: 14px; flex: none; display: block; }
.brand {
  color: #fff; text-align: center; font-size: 25px; font-weight: 800;
  letter-spacing: .6px; padding: 26px 0 14px; margin: 0;
  background: linear-gradient(180deg, #ffffff 20%, #c3d4ff 90%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 14px rgba(96, 150, 255, .35));
}
.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
footer { text-align: center; font-size: 12px; color: rgba(219, 230, 255, .55); padding-top: 26px; }
footer a { color: rgba(219, 230, 255, .85); font-weight: 700; text-decoration: none; }
footer a:hover { opacity: .75; }

/* ---- shared card chrome ---- */
.card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: var(--card-shadow);
  backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
  font-size: 14px;
}
.board { display: flex; gap: 22px; align-items: stretch; width: 100%; max-width: 780px; }

/* ---- left: upload ---- */
.uploader {
  width: 314px; flex: none; cursor: pointer;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(120, 160, 255, .10), transparent 55%),
    var(--glass);
  transition: box-shadow .2s, border-color .2s;
}
.uploader:hover { border-color: rgba(255, 255, 255, .16); }
.uploader:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.uploader .inner {
  height: 100%; min-height: 370px; padding: 30px 24px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}
.ring {
  width: 80px; height: 80px; border-radius: 50%;
  border: 1.5px solid rgba(160, 190, 255, .38);
  background: radial-gradient(circle at 32% 28%, rgba(140, 180, 255, .24), rgba(80, 110, 220, .08) 62%);
  box-shadow: 0 0 0 6px rgba(110, 150, 255, .05), 0 12px 32px rgba(16, 36, 110, .5),
    inset 0 1px 0 rgba(255, 255, 255, .16);
  display: flex; align-items: center; justify-content: center; position: relative; flex: none;
  transition: border-color .2s, box-shadow .2s;
}
.ring svg { width: 42px; height: 42px; }
.ring::before {
  content: ''; position: absolute; inset: -5px; border-radius: 50%;
  border: 1px solid rgba(150, 185, 255, .35);
  animation: halo 1.8s ease-out infinite;
}
@keyframes halo {
  0%   { transform: scale(1); opacity: .9 }
  100% { transform: scale(1.34); opacity: 0 }
}
.uploader.dragover .ring {
  border-color: var(--accent);
  box-shadow: 0 0 0 6px rgba(96, 150, 255, .14), 0 0 34px rgba(96, 150, 255, .4),
    inset 0 1px 0 rgba(255, 255, 255, .16);
}
.uploader.dragover {
  border-color: rgba(120, 170, 255, .55);
  box-shadow: 0 0 0 2px rgba(96, 150, 255, .55), 0 24px 60px rgba(1, 4, 16, .55);
}
.hint { text-align: center; font-size: 12px; line-height: 1.8; }
.hint b { display: block; color: var(--ink); font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 0; border-radius: 40px; color: #fff;
  background: linear-gradient(135deg, #3b8bff 0%, #6a5cff 100%);
  font: 700 13px/1 inherit; font-family: inherit; padding: 10px 24px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(3, 10, 40, .35), 0 6px 20px rgba(80, 120, 255, .42),
    inset 0 1px 0 rgba(255, 255, 255, .25);
  transition: filter .16s, transform .12s, box-shadow .16s, background-color .16s;
}
.btn:hover { filter: brightness(1.1); box-shadow: 0 2px 4px rgba(3, 10, 40, .35), 0 8px 26px rgba(80, 120, 255, .55), inset 0 1px 0 rgba(255, 255, 255, .25); }
.btn:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(3, 10, 40, .4); }
.btn.ghost {
  background: transparent; color: #aeb9cf; box-shadow: none;
  border: 1px solid rgba(255, 255, 255, .16);
}
.btn.ghost:hover { background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .3); color: #fff; box-shadow: none; filter: none; }
.btn.small { padding: 7px 14px; font-size: 12px; gap: 6px; }
.btn .icon { width: 13px; height: 13px; }
#file-input { display: none; }

/* ---- right: results ---- */
.results { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.results .head {
  padding: 12px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; flex: none;
}
.results .head h2 {
  margin: 0; font-size: 12px; font-weight: 700; color: var(--ink);
  letter-spacing: .3px; display: inline-flex; align-items: center; gap: 7px;
}
.results .head h2 .icon { width: 13px; height: 13px; color: var(--muted); }
.results .head .count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#queue {
  flex: 1; overflow-y: auto; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px; min-height: 150px; max-height: 260px;
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .16) transparent;
}
#queue::-webkit-scrollbar { width: 8px; }
#queue::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 4px; }
#queue::-webkit-scrollbar-track { background: transparent; }
#queue:empty::after {
  content: '上传的文件会显示在这里';
  margin: auto; font-size: 12px; color: var(--muted);
}
.item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px; border-radius: 10px; transition: background .15s;
}
.item:hover { background: rgba(255, 255, 255, .045); }
.item .thumb {
  width: 32px; height: 32px; border-radius: 8px; flex: none; object-fit: cover;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .09);
  background: rgba(255, 255, 255, .06); display: flex; align-items: center; justify-content: center;
  font-size: 15px; overflow: hidden;
}
.item .info { flex: 1; min-width: 0; }
.item .name {
  font-size: 12px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.item .meta.error { color: var(--err); }
.progress {
  height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .09); overflow: hidden; margin-top: 5px;
  transition: height .3s, margin-top .3s, opacity .25s;
}
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3b8bff, #7c6cff); transition: width .15s; }
.item.done .progress { height: 0; margin-top: 0; opacity: 0; }
.item.error .progress i { background: var(--err); }
.item .state { display: inline-flex; align-items: center; gap: 4px; }
.item .state .icon { width: 11px; height: 11px; color: var(--ok); }
.item .copy-one {
  flex: none; width: 26px; height: 26px; padding: 0; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px; background: transparent; color: var(--muted);
  opacity: 0; transition: opacity .15s, background .15s, color .15s;
}
.item:hover .copy-one, .item .copy-one:focus-visible { opacity: 1; }
.item .copy-one:hover { background: var(--accent-soft); color: #9cc2ff; }
.item .copy-one .icon { width: 14px; height: 14px; }
@media (hover: none) { .item .copy-one { opacity: 1; } }
.out { border-top: 1px solid var(--line); padding: 11px 14px; flex: none; }
/* Segmented control reads tighter than four separate pills. */
.tabs {
  display: inline-flex; gap: 2px; margin-bottom: 9px; padding: 2px;
  background: rgba(255, 255, 255, .055); border-radius: 10px;
}
.tabs button {
  border: 0; background: transparent; color: #8b96b0; border-radius: 8px;
  padding: 5px 11px; font: 600 11px inherit; font-family: inherit; cursor: pointer;
  transition: background .15s, color .15s, box-shadow .15s;
}
.tabs button:hover { color: var(--ink); }
.tabs button.active {
  background: linear-gradient(135deg, #3b8bff 0%, #6a5cff 100%); color: #fff;
  box-shadow: 0 2px 8px rgba(80, 120, 255, .4);
}
#link-output {
  /* One entry per line (ids are long) so rows map 1:1 to links; overflow scrolls. */
  white-space: pre; overflow: auto;
  width: 100%; height: 72px; max-height: 180px; resize: vertical; padding: 8px;
  border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px;
  background: rgba(3, 6, 18, .55); color: #c7d3ea;
  font: 11px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
}
#link-output:focus { outline: none; border-color: rgba(120, 170, 255, .55); box-shadow: 0 0 0 3px rgba(96, 150, 255, .18); }
.actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 9px; }

/* ---- setup notice ---- */
#setup-notice { display: none; width: 100%; max-width: 780px; margin-bottom: 18px; }
#setup-notice .problem {
  border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  font-size: 12px; line-height: 1.7; border-left: 3px solid;
  background: rgba(10, 15, 32, .85); box-shadow: var(--card-shadow);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
#setup-notice .problem b { display: block; font-weight: 700; margin-bottom: 2px; }
#setup-notice .problem.error { border-left-color: var(--err); color: #f0b3b8; }
#setup-notice .problem.warning { border-left-color: #ffb84d; color: #ecd3a3; }
#setup-notice .problem.info { border-left-color: var(--accent); color: #b9d9f7; }

/* ---- toast ---- */
#toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(18px);
  background: rgba(9, 13, 27, .92); color: #eef3ff; padding: 10px 20px; border-radius: 40px;
  border: 1px solid rgba(255, 255, 255, .13);
  box-shadow: 0 12px 32px rgba(1, 4, 16, .5);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 13px; opacity: 0; pointer-events: none; z-index: 10;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  .ring::before { animation: none; }
  .btn, .topbar a, .uploader { transition: none; }
}

/* ---- narrow screens: stack the two columns ---- */
@media (max-width: 760px) {
  .page { padding: 20px 16px; }
  .brand { font-size: 22px; padding: 20px 0 10px; }
  .board { flex-direction: column; max-width: 420px; }
  .uploader { width: 100%; }
  .uploader .inner { min-height: 0; padding: 26px 20px; }
  #queue { max-height: 200px; }
}

</style>
</head>

<script>
(function () {
  'use strict';

  // Same icon as the toolbar copy button, reused for the per-row control.
  var TICK_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg>';
  var COPY_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11.5" height="11.5" rx="2.2"/><path d="M5.5 15.5H5a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 5 3.5h9A1.5 1.5 0 0 1 15.5 5v.5"/></svg>';

  var MAX_CONCURRENT = 3;
  var uploaded = [];        // { url, fileName }
  var activeUploads = 0;
  var pending = [];
  var currentFormat = 'url';

  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('file-input');
  var queue = document.getElementById('queue');
  var resultsCard = document.getElementById('results-card');
  var linkOutput = document.getElementById('link-output');
  var fileCount = document.getElementById('file-count');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  // ---- starfield backdrop ----
  // Canvas starfield over the CSS deep-space gradient: twinkling stars with a
  // slow drift and the occasional shooting star. An explicit backgroundImage
  // from /api/config still replaces the whole backdrop (see the config block
  // below, which clears #backdrop before painting it).
  (function initStarfield() {
    var backdrop = document.getElementById('backdrop');
    if (!backdrop) return;
    var canvas = document.createElement('canvas');
    canvas.id = 'starfield';
    canvas.setAttribute('aria-hidden', 'true');
    backdrop.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0;
    var H = 0;
    var stars = [];
    var meteors = [];
    var lastMeteor = 0;

    function seed() {
      var count = Math.min(260, Math.floor(W * H / 6500));
      stars = [];
      for (var i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.3 + 0.3,
          base: Math.random() * 0.55 + 0.25,   // resting alpha
          amp: Math.random() * 0.35,          // twinkle amplitude
          speed: Math.random() * 0.9 + 0.25,  // twinkle speed
          phase: Math.random() * Math.PI * 2,
          drift: Math.random() * 0.014 + 0.004
        });
      }
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      seed();
      if (reduced) draw(0);
    }

    function spawnMeteor(now) {
      var fromLeft = Math.random() < 0.5;
      meteors.push({
        x: fromLeft ? Math.random() * W * 0.35 : W * 0.45 + Math.random() * W * 0.4,
        y: Math.random() * H * 0.3,
        vx: (fromLeft ? 1 : -1) * (5.2 + Math.random() * 2.4),
        vy: 2.6 + Math.random() * 1.4,
        life: 1
      });
      lastMeteor = now;
    }

    function draw(now) {
      ctx.clearRect(0, 0, W, H);
      var t = now / 1000;
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = s.base + Math.sin(t * s.speed + s.phase) * s.amp;
        if (a < 0.05) a = 0.05;
        ctx.globalAlpha = a;
        ctx.fillStyle = '#dfe9ff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        if (s.r > 1.15) {  // soft halo on the bigger stars
          ctx.globalAlpha = a * 0.16;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 3.4, 0, Math.PI * 2);
          ctx.fill();
        }
        s.y += s.drift;
        if (s.y - 2 > H) { s.y = -2; s.x = Math.random() * W; }
      }
      ctx.globalAlpha = 1;

      if (!reduced && now - lastMeteor > 6000 && meteors.length < 2 && Math.random() < 0.02) {
        spawnMeteor(now);
      }
      for (var j = meteors.length - 1; j >= 0; j--) {
        var m = meteors[j];
        var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 9, m.y - m.vy * 9);
        grad.addColorStop(0, 'rgba(255,255,255,' + (0.85 * m.life) + ')');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 9, m.y - m.vy * 9);
        ctx.stroke();
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.012;
        if (m.life <= 0 || m.x < -120 || m.x > W + 120 || m.y > H + 60) meteors.splice(j, 1);
      }
    }

    function loop(now) {
      draw(now || 0);
      requestAnimationFrame(loop);
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 160);
    });

    resize();
    if (!reduced) requestAnimationFrame(loop);
  })();

  // ---- site config (/api/config) ----
  fetch('/api/config').then(function (res) {
    if (!res.ok) throw new Error('config unavailable');
    return res.json();
  }).then(function (config) {
    if (config.siteName) {
      document.getElementById('site-name').textContent = config.siteName;
    }
    if (config.siteTitle) {
      document.title = config.siteTitle;
    }
    // An explicit background replaces the slideshow entirely.
    if (config.backgroundImage) {
      var backdrop = document.getElementById('backdrop');
      backdrop.textContent = '';
      backdrop.style.backgroundImage = 'url("' + String(config.backgroundImage).replace(/"/g, '%22') + '")';
      backdrop.style.backgroundSize = 'cover';
      backdrop.style.backgroundPosition = 'center';
    }
    if (config.showAdminEntry === false) {
      var adminLink = document.getElementById('admin-link');
      if (adminLink) adminLink.remove();
    }
    renderSetupProblems(config.problems);
  }).catch(function () { /* defaults already in markup */ });

  // Show deployment problems (missing bindings/variables) instead of letting the
  // first upload fail with an opaque error.
  function renderSetupProblems(problems) {
    if (!problems || !problems.length) return;
    var box = document.getElementById('setup-notice');
    var titles = { error: '需要处理', warning: '注意', info: '提示' };
    problems.forEach(function (problem) {
      var el = document.createElement('div');
      el.className = 'problem ' + (problem.severity || 'info');
      var label = document.createElement('b');
      label.textContent = titles[problem.severity] || titles.info;
      el.appendChild(label);
      el.appendChild(document.createTextNode(problem.message));
      box.appendChild(el);
    });
    box.style.display = 'block';
  }

  // ---- input wiring: click / drag / paste ----
  dropzone.addEventListener('click', function () { fileInput.click(); });
  dropzone.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fileInput.click(); }
  });
  document.getElementById('pick').addEventListener('click', function (event) {
    event.stopPropagation();   // the card itself already opens the picker
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    enqueueFiles(fileInput.files);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (type) {
    dropzone.addEventListener(type, function (event) {
      event.preventDefault();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(function (type) {
    dropzone.addEventListener(type, function (event) {
      event.preventDefault();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', function (event) {
    if (event.dataTransfer && event.dataTransfer.files.length) {
      enqueueFiles(event.dataTransfer.files);
    }
  });

  document.addEventListener('paste', function (event) {
    if (!event.clipboardData) return;
    var files = [];
    for (var i = 0; i < event.clipboardData.items.length; i++) {
      var item = event.clipboardData.items[i];
      if (item.kind === 'file') {
        var file = item.getAsFile();
        if (file) files.push(file);
      }
    }
    if (files.length) enqueueFiles(files);
  });

  // ---- upload queue ----
  function enqueueFiles(fileList) {
    Array.prototype.forEach.call(fileList, function (file) {
      var item = createQueueItem(file);
      pending.push({ file: file, item: item });
    });
    updateCount();
    pumpQueue();
  }

  function pumpQueue() {
    while (activeUploads < MAX_CONCURRENT && pending.length) {
      var next = pending.shift();
      activeUploads++;
      uploadFile(next.file, next.item);
    }
  }

  function updateCount() {
    var total = queue.children.length;
    fileCount.textContent = total ? '共 ' + total + ' 个文件' : '';
  }

  function createQueueItem(file) {
    var item = document.createElement('div');
    item.className = 'item';

    var thumb;
    if (file.type.indexOf('image/') === 0) {
      thumb = document.createElement('img');
      thumb.className = 'thumb';
      thumb.alt = '';
      thumb.src = URL.createObjectURL(file);
      thumb.onload = function () { URL.revokeObjectURL(thumb.src); };
    } else {
      thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.textContent = file.type.indexOf('video/') === 0 ? '🎬'
        : file.type.indexOf('audio/') === 0 ? '🎵' : '📄';
    }

    var info = document.createElement('div');
    info.className = 'info';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = file.name;
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = formatSize(file.size) + ' · 等待上传…';
    var progress = document.createElement('div');
    progress.className = 'progress';
    progress.appendChild(document.createElement('i'));
    info.appendChild(name);
    info.appendChild(meta);
    info.appendChild(progress);

    item.appendChild(thumb);
    item.appendChild(info);
    queue.appendChild(item);

    return { root: item, meta: meta, bar: progress.firstChild };
  }

  function uploadFile(file, item) {
    var formData = new FormData();
    formData.append('file', file);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');

    xhr.upload.onprogress = function (event) {
      if (event.lengthComputable) {
        var percent = Math.round(event.loaded / event.total * 100);
        item.bar.style.width = percent + '%';
        item.meta.textContent = formatSize(file.size) + ' · 上传中 ' + percent + '%';
      }
    };

    xhr.onload = function () {
      var src = null;
      var errorMessage = null;
      try {
        var data = JSON.parse(xhr.responseText);
        if (xhr.status === 200 && data && data[0] && data[0].src) {
          src = data[0].src;
        } else {
          errorMessage = (data && data.error) || ('HTTP ' + xhr.status);
        }
      } catch (parseError) {
        errorMessage = 'HTTP ' + xhr.status;
      }

      if (src) {
        finishItem(item, file, src);
      } else {
        failItem(item, file, errorMessage);
      }
      activeUploads--;
      pumpQueue();
    };

    xhr.onerror = function () {
      failItem(item, file, '网络错误');
      activeUploads--;
      pumpQueue();
    };

    xhr.send(formData);
  }

  function finishItem(item, file, src) {
    var fullUrl = location.origin + src;
    uploaded.push({ url: fullUrl, fileName: file.name });

    item.root.classList.add('done');
    item.bar.style.width = '100%';
    item.meta.textContent = '';
    var state = document.createElement('span');
    state.className = 'state';
    state.innerHTML = TICK_ICON;
    state.appendChild(document.createTextNode('上传成功'));
    item.meta.appendChild(document.createTextNode(formatSize(file.size) + ' · '));
    item.meta.appendChild(state);

    var copyButton = document.createElement('button');
    copyButton.type = 'button';
    copyButton.className = 'copy-one';
    copyButton.title = '复制链接';
    copyButton.setAttribute('aria-label', '复制 ' + file.name + ' 的链接');
    copyButton.innerHTML = COPY_ICON;
    copyButton.addEventListener('click', function () {
      copyText(formatLink({ url: fullUrl, fileName: file.name }, currentFormat));
    });
    item.root.appendChild(copyButton);

    renderOutput();
  }

  function failItem(item, file, message) {
    item.root.classList.add('error');
    item.bar.style.width = '100%';
    item.meta.className = 'meta error';
    item.meta.textContent = '上传失败：' + message;
  }

  // ---- link formats ----
  function formatLink(entry, format) {
    switch (format) {
      case 'markdown': return '![' + entry.fileName + '](' + entry.url + ')';
      case 'bbcode': return '[img]' + entry.url + '[/img]';
      case 'html': return '<img src="' + entry.url + '" alt="' + escapeHtml(entry.fileName) + '">';
      default: return entry.url;
    }
  }

  function escapeHtml(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderOutput() {
    resultsCard.hidden = uploaded.length === 0;
    linkOutput.value = uploaded.map(function (entry) {
      return formatLink(entry, currentFormat);
    }).join('\n');
  }

  document.getElementById('format-tabs').addEventListener('click', function (event) {
    var button = event.target.closest('button[data-format]');
    if (!button) return;
    currentFormat = button.dataset.format;
    this.querySelectorAll('button').forEach(function (other) {
      other.classList.toggle('active', other === button);
    });
    renderOutput();
  });

  document.getElementById('copy-all').addEventListener('click', function () {
    if (linkOutput.value) copyText(linkOutput.value);
  });

  document.getElementById('clear-all').addEventListener('click', function () {
    uploaded = [];
    queue.textContent = '';
    updateCount();
    renderOutput();
  });

  // ---- helpers ----
  function copyText(text) {
    var done = function () { showToast('已复制到剪贴板'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
    } else {
      legacyCopy(text);
      done();
    }
  }

  function legacyCopy(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }
})();
</script>
</body>
</html>
